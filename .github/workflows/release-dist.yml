name: Build release artifact

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dist:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build dist
        run: npm run build
      
      - name: Verify dist is bundled
        run: |
          test -f dist/sensor-bar-card-plus.js
          ! grep -q "from './card/SensorBarCard.js'" dist/sensor-bar-card-plus.js
          ! grep -q "from './editor/SensorBarCardPlusEditor.js'" dist/sensor-bar-card-plus.js
      
      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/sensor-bar-card-plus.js
